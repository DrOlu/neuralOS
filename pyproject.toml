[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralos"
version = "3.10.2"
description = "neuralOS - automation foundation model for tiny devices: 2-bit tool-calling engine, bundled for offline install. Inference, LoRA finetuning, and build."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "huggingface_hub",
]

[project.optional-dependencies]
train = [
  "numpy",
  "jax",
  "jaxlib",
  "flax>=0.10.2",
  "optax",
  "safetensors",
  "sentencepiece"
]
gpu = ["jax[cuda12]"]
metal = [
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "jax-metal"
]
test = ["pytest", "pydantic"]

[project.scripts]
needle = "needle.cli:main"
neuralos = "needle.cli:main"

[tool.setuptools.packages.find]
include = ["needle*"]

[tool.setuptools.package-data]
# Engine-bundled platform wheels stage libneedle3.* and needle3.cact here
# (scripts/build_neuralos_wheels.py) before the wheel is built. The runtime
# (needle/_library_path + _base_weights_path) picks them up automatically;
# wheels without them fall back to the HuggingFace download path.
"needle" = ["libneedle*.dylib", "libneedle*.so", "libneedle*.dll", "*.cact"]
"needle.model" = ["*.model", "*.vocab"]
"needle.playground" = ["index.html", "app.js", "style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end JAX build/finetune tests (init a tiny model)"]
